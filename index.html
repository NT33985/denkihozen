<style>
:root{--navy:#0f172a;--navy2:#16233b;--blue:#2563eb;--blue2:#dbeafe;--ink:#172033;--muted:#667085;--line:#e5e7eb;--bg:#f4f7fb;--card:#fff;--green:#15803d;--greenBg:#ecfdf3;--red:#dc2626;--redBg:#fef2f2;--amber:#b45309;--amberBg:#fff7ed;--shadow:0 12px 35px rgba(15,23,42,.08);--radius:18px}
*{box-sizing:border-box} html{-webkit-text-size-adjust:100%} body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP","Hiragino Sans","Yu Gothic UI","Yu Gothic",Meiryo,sans-serif;line-height:1.65}

.wrap{padding:18px 14px}.card{background:var(--card);border:1px solid #e8ecf2;border-radius:var(--radius);box-shadow:0 5px 20px rgba(15,23,42,.045);padding:18px;margin-bottom:14px}
.section-title{font-size:14px;font-weight:800;margin:0 0 12px;color:#344054}.chips{display:flex;flex-wrap:wrap;gap:8px}.chip{border:1px solid #d0d5dd;background:#fff;border-radius:999px;padding:9px 14px;font-weight:700;font-size:14px;color:#344054}.chip.active{background:var(--navy);border-color:var(--navy);color:#fff}.seg{display:grid;grid-template-columns:1fr 1fr;border:1px solid #d0d5dd;border-radius:13px;padding:4px;background:#f8fafc;gap:4px}.seg button{border:0;background:transparent;padding:10px;border-radius:10px;font-weight:800;color:#667085}.seg button.active{background:#fff;color:var(--ink);box-shadow:0 1px 5px rgba(15,23,42,.10)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.stat{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:12px 8px;text-align:center}.stat b{display:block;font-size:21px;line-height:1.25}.stat span{display:block;color:var(--muted);font-size:11px;margin-top:3px}

.hidden{display:none!important}
.topbar{position:sticky;top:0;z-index:8;background:rgba(244,247,251,.94);backdrop-filter:blur(14px);padding:10px 12px;border-bottom:1px solid rgba(229,231,235,.8)}.toprow{max-width:820px;margin:auto;display:flex;align-items:center;gap:9px}.iconbtn{width:42px;height:42px;border-radius:13px;border:1px solid #d8dee8;background:#fff;font-size:18px}.topmeta{flex:1;min-width:0}.topmeta b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.topmeta span{font-size:11px;color:var(--muted)}.score-pill{font-size:12px;font-weight:800;background:#fff;border:1px solid #e5e7eb;border-radius:999px;padding:7px 10px;white-space:nowrap}
.progress-track{height:5px;background:#e2e8f0}.progress-bar{height:100%;background:var(--blue);width:0;transition:width .25s}
.quiz-wrap{padding:15px 12px 100px}.qcard{background:#fff;border:1px solid #e5e7eb;border-radius:20px;box-shadow:var(--shadow);padding:18px}.qhead{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px}.badge{background:#eef2ff;color:#3730a3;border-radius:999px;padding:5px 10px;font-size:12px;font-weight:800}.qid{color:var(--muted);font-size:12px}.qtext{font-size:18px;font-weight:750;line-height:1.75;margin:8px 0 14px;white-space:pre-wrap}.figure-wrap{background:#fff;border:1px solid #e5e7eb;border-radius:14px;padding:10px;margin:10px 0 16px;text-align:center}.figure-wrap img{display:block;max-width:100%;max-height:520px;height:auto;margin:auto;object-fit:contain;cursor:zoom-in}
.options{display:grid;gap:10px}.option{width:100%;text-align:left;border:1.5px solid #d7dce4;background:#fff;border-radius:15px;padding:13px 14px;display:flex;gap:12px;align-items:flex-start;color:var(--ink);font-weight:600;line-height:1.55}.option .mark{flex:0 0 34px;height:34px;border-radius:10px;background:#f2f4f7;display:flex;align-items:center;justify-content:center;font-weight:900}.option:hover{border-color:#9db7f8}.option.selected.correct,.option.correct-answer{border-color:#86efac;background:var(--greenBg)}.option.selected.wrong{border-color:#fca5a5;background:var(--redBg)}.option:disabled{cursor:default;opacity:1}.tf-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.tf-grid .option{align-items:center;justify-content:center;text-align:center;padding:17px 10px}.tf-grid .mark{background:transparent;font-size:28px}.tf-grid .txt{font-size:15px}
.feedback{margin-top:16px;border-radius:16px;padding:15px;border:1px solid}.feedback.ok{background:var(--greenBg);border-color:#bbf7d0}.feedback.ng{background:var(--redBg);border-color:#fecaca}.feedback-title{font-size:19px;font-weight:900;margin-bottom:3px}.feedback.ok .feedback-title{color:var(--green)}.feedback.ng .feedback-title{color:var(--red)}.correct-line{font-size:13px;font-weight:800}
.explain{margin-top:12px;display:grid;gap:10px}.exbox{border-radius:15px;padding:14px 15px}.exbox h3{font-size:13px;margin:0 0 6px}.exbox p{margin:0;font-size:14px;white-space:pre-wrap}.explain-box{background:#f8fafc;border:1px solid #e2e8f0}.memory-box{background:var(--amberBg);border:1px solid #fed7aa}.memory-box h3{color:var(--amber)}.source-link{display:inline-flex;align-items:center;gap:5px;margin-top:2px;font-size:12px;font-weight:750;color:#1d4ed8;text-decoration:none}
.nextbar{position:fixed;left:0;right:0;bottom:0;z-index:7;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:linear-gradient(to top,rgba(244,247,251,1) 70%,rgba(244,247,251,0))}.nextbar-inner{max-width:796px;margin:auto;display:grid;grid-template-columns:110px 1fr;gap:8px}.nextbar button{padding:13px;border-radius:14px;font-weight:850}.prevbtn{background:#fff;border:1px solid #d0d5dd;color:#475467}.nextbtn{background:var(--blue);border:1px solid var(--blue);color:#fff}.nextbtn:disabled,.prevbtn:disabled{opacity:.45}
.result{padding:22px 14px}.result-card{text-align:center;padding:26px 18px}.result-icon{font-size:52px}.result h2{margin:4px 0 6px}.result .bigscore{font-size:38px;font-weight:900;letter-spacing:-.03em}.result .sub{color:var(--muted);font-size:13px;margin-bottom:16px}
.toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%) translateY(20px);background:#111827;color:#fff;padding:10px 15px;border-radius:999px;font-size:13px;font-weight:700;opacity:0;pointer-events:none;transition:.2s;z-index:20;white-space:nowrap;max-width:90vw}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.modal{position:fixed;inset:0;background:rgba(2,6,23,.88);z-index:30;display:flex;align-items:center;justify-content:center;padding:18px}.modal img{max-width:96vw;max-height:88vh;object-fit:contain;background:#fff;border-radius:12px}.modal button{position:absolute;top:calc(12px + env(safe-area-inset-top));right:14px;width:44px;height:44px;border:0;border-radius:50%;background:#fff;color:#111827;font-size:22px;font-weight:900}
.smallrow{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:10px}.muted{color:var(--muted);font-size:12px}.count-badge{background:#fff;border:1px solid #fecaca;color:#b42318;border-radius:999px;padding:3px 8px;font-weight:800;font-size:11px}
@media (min-width:700px){.hero{padding:38px 28px 34px}.hero h1{font-size:28px}.wrap{padding:22px}.quiz-wrap{padding:20px 20px 110px}.qcard{padding:24px}.qtext{font-size:20px}.options{gap:11px}.option{padding:15px}.stats{gap:12px}.stat{padding:15px}}

/* ===== Smartphone / Android / iPhone final responsive tuning ===== */
html{width:100%;overflow-x:hidden;scroll-padding-top:74px}
body{width:100%;min-width:0;overflow-x:hidden;-webkit-overflow-scrolling:touch;overscroll-behavior-y:auto}
.app{width:100%;min-height:100vh;min-height:100dvh;overflow-x:clip}
img,svg,canvas{max-width:100%;height:auto}
button,.chip,.option,a{-webkit-tap-highlight-color:transparent;touch-action:manipulation}
button{min-height:44px}
.qcard,.card,.toprow,.topmeta,.options,.option,.option .txt,.exbox,.smallrow{min-width:0}
.qtext,.option .txt,.exbox p,.correct-line,.muted,.note{overflow-wrap:anywhere;word-break:normal}
.figure-wrap{overflow:hidden}
.figure-wrap img{width:auto;max-width:100%;height:auto}
.source-link{max-width:100%;overflow-wrap:anywhere}
.topbar{padding-top:max(10px,env(safe-area-inset-top));padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
.nextbar{padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right));padding-bottom:max(10px,env(safe-area-inset-bottom))}
.modal{height:100vh;height:100dvh;padding-top:max(18px,env(safe-area-inset-top));padding-bottom:max(18px,env(safe-area-inset-bottom));padding-left:max(18px,env(safe-area-inset-left));padding-right:max(18px,env(safe-area-inset-right))}
.modal img{max-width:100%;max-height:calc(100dvh - 72px)}

@media (hover:none){
  .option:hover{border-color:#d7dce4}
}

/* Standard smartphones: iPhone / Pixel / Galaxy etc. */
@media (max-width:699px){
  :root{--radius:16px}
  .hero{padding:24px 16px 22px;border-radius:0 0 22px 22px}
  .hero h1{font-size:clamp(20px,6vw,24px);line-height:1.34}
  .hero p{font-size:12px}
  .wrap{padding:14px 10px}
  .card{padding:15px;margin-bottom:11px}
  .quiz-wrap{padding:12px 10px calc(98px + env(safe-area-inset-bottom))}
  .qcard{padding:15px;border-radius:17px}
  .qhead{margin-bottom:8px}
  .qtext{font-size:clamp(16px,4.5vw,18px);line-height:1.7;margin:7px 0 12px}
  .figure-wrap{padding:7px;margin:8px 0 13px;border-radius:12px}
  .figure-wrap img{max-height:58vh;max-height:58dvh}
  .options{gap:8px}
  .option{padding:12px 11px;gap:10px;border-radius:13px;line-height:1.5;font-size:14px}
  .option .mark{flex-basis:32px;width:32px;height:32px;border-radius:9px}
  .feedback{margin-top:13px;padding:13px;border-radius:14px}
  .feedback-title{font-size:18px}
  .explain{margin-top:10px;gap:8px}
  .exbox{padding:12px 13px;border-radius:13px}
  .exbox p{font-size:13.5px;line-height:1.65}
  .nextbar-inner{grid-template-columns:minmax(86px,30%) minmax(0,1fr);gap:7px}
  .nextbar button{padding:12px 10px;white-space:nowrap}
  .score-pill{padding:6px 8px;font-size:11px}
  .topbar{padding-bottom:8px}
  .iconbtn{width:40px;height:40px;flex:0 0 40px}
  .smallrow{flex-wrap:wrap;align-items:flex-start}
  .smallrow .danger{margin-left:auto}
}

/* Narrow Android/iPhone SE class devices */
@media (max-width:380px){
  .wrap{padding-left:8px;padding-right:8px}
  .quiz-wrap{padding-left:8px;padding-right:8px}
  .qcard{padding:13px}
  .toprow{gap:7px}
  .topmeta b{font-size:12px}
  .topmeta span{font-size:10.5px}
  .score-pill{font-size:10.5px;padding:5px 7px}
  .qhead{gap:6px}
  .badge,.qid{font-size:11px}
  .option{padding:11px 9px;gap:8px;font-size:13.5px}
  .option .mark{flex-basis:30px;width:30px;height:30px}
  .tf-grid .option{padding:14px 8px}
  .tf-grid .mark{font-size:25px}
  .stats{gap:6px}
  .stat{padding:10px 5px}
  .stat b{font-size:19px}
  .chip{padding:8px 11px;font-size:13px}
  .seg button{padding:9px 6px;font-size:13px}
}

/* Very narrow embedded-browser widths */
@media (max-width:330px){
  .hero{padding-left:12px;padding-right:12px}
  .hero h1{font-size:19px}
  .topmeta b{max-width:126px}
  .score-pill{padding:5px 6px}
  .qtext{font-size:16px}
  .option{font-size:13px}
  .nextbar-inner{grid-template-columns:80px minmax(0,1fr)}
  .nextbar button{font-size:13px;padding-left:7px;padding-right:7px}
}

/* Phones in landscape: keep controls compact and usable. */
@media (max-height:520px) and (orientation:landscape){
  .hero{padding-top:18px;padding-bottom:18px}
  .quiz-wrap{padding-bottom:82px}
  .figure-wrap img{max-height:55vh;max-height:55dvh}
  .nextbar{padding-top:7px;padding-bottom:max(7px,env(safe-area-inset-bottom))}
  .nextbar button{padding-top:9px;padding-bottom:9px}
}

</style>
</head>
<body>
<div class="app">
  <section id="homeScreen">
    <header class="hero">
      <div class="eyebrow">2023–2025年度｜全150問</div>
      <h1>機械保全技能検定<br>電気系保全作業 2級</h1>
      <p>1問1答 学科学習アプリ</p>
    </header>
    <div class="wrap">
      <div class="card">
        <div class="section-title">学習状況</div>
        <div class="stats">
          <div class="stat"><b id="statDone">0</b><span>学習済み</span></div>
          <div class="stat"><b id="statRate">—</b><span>正答率</span></div>
          <div class="stat"><b id="statMissed">0</b><span>苦手問題</span></div>
        </div>
      </div>
      <div class="card">
        <div class="section-title">出題年度</div>
        <div class="chips" id="yearChips">
          <button class="chip active" data-year="all">すべて</button>
          <button class="chip" data-year="2023">2023</button>
          <button class="chip" data-year="2024">2024</button>
          <button class="chip" data-year="2025">2025</button>
        </div>
        <div class="section-title" style="margin-top:18px">出題順</div>
        <div class="seg" id="orderSeg">
          <button class="active" data-order="normal">問題番号順</button>
          <button data-order="random">ランダム</button>
        </div>
      </div>
      <div class="card stack">
        <button class="primary" id="startAll">学習をはじめる</button>
        <button class="secondary" id="startMissed">間違えた問題を復習 <span id="missedBtnCount"></span></button>
        <div class="note">回答するとすぐに正誤・解説・暗記ポイントを表示します。</div>
      </div>
      <div class="card">
        <div class="section-title">学習データ</div>
        <div class="smallrow"><span class="muted">端末内に正答率・苦手問題を保存します。</span><button class="danger" id="resetStats" style="width:auto;padding:8px 12px">履歴をリセット</button></div>
      </div>
    </div>
  </section>

  <section id="quizScreen" class="hidden">
    <div class="topbar">
      <div class="toprow">
        <button class="iconbtn" id="homeBtn" aria-label="ホームへ">⌂</button>
        <div class="topmeta"><b id="quizTitle">電気系保全作業 2級</b><span id="quizMeta"></span></div>
        <div class="score-pill" id="scorePill">0 / 0</div>
      </div>
    </div>
    <div class="progress-track"><div class="progress-bar" id="progressBar"></div></div>
    <div class="quiz-wrap">
      <article class="qcard">
        <div class="qhead"><span class="badge" id="typeBadge"></span><span class="qid" id="qid"></span></div>

        <div class="figure-wrap hidden" id="figureWrap"><img id="questionImage" alt="問題図"></div>
        <div id="options" class="options"></div>
        <div id="feedback" class="feedback hidden">
          <div class="feedback-title" id="feedbackTitle"></div>
          <div class="correct-line" id="correctLine"></div>
        </div>
        <div id="explain" class="explain hidden">
          <div class="exbox explain-box"><h3>📘 解説</h3><p id="explanationText"></p></div>
          <div class="exbox memory-box"><h3>💡 ワンポイント暗記</h3><p id="memoryText"></p></div>
          <a id="sourceLink" class="source-link" href="#" target="_blank" rel="noopener">参考資料を開く ↗</a>
        </div>
      </article>
    </div>
    <div class="nextbar"><div class="nextbar-inner"><button class="prevbtn" id="prevBtn">← 前へ</button><button class="nextbtn" id="nextBtn" disabled>次の問題 →</button></div></div>
  </section>

  <section id="resultScreen" class="hidden result">
    <div class="card result-card">
      <div class="result-icon" id="resultIcon">🎉</div>

      <div class="sub" id="resultSub"></div>

    </div>
  </section>
</div>

<script id="question-data" type="application/json">[{"id":"2023-01","year":2023,"number":1,"type":"真偽","question":"ボール盤において、材質が硬いものを工作する場合、ドリルの回転数を上げる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"硬い材料ほど切削熱や刃先摩耗が増えやすいため、一般にドリルの切削速度・回転数は低めに設定する。したがって「回転数を上げる」は誤り。","memory":"硬い材料＝回転数は低め。","source":"https://faq.osg.co.jp/faq/show/17997?site_domain=en"},{"id":"2023-02","year":2023,"number":2,"type":"真偽","question":"電解加工機は、工具を陰極、工作物を陽極として、電解液中で電極間に電流を流すことで加工する工作機械である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"電解加工は、電解液中で工具側を陰極、工作物側を陽極として電気化学的に工作物を溶解除去する加工法。記述は正しい。","memory":"電解加工＝工具(－)、工作物(＋)、電解液。","source":"https://www.sodick.co.jp/products/coretech/discharge.html"},{"id":"2023-03","year":2023,"number":3,"type":"真偽","question":"三相誘導電動機のスターデルタ始動では、始動トルクは直入れ始動時の1/3となる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"Y-Δ始動では始動時に各相へ加わる電圧が低くなるため、直入れ始動に比べ始動電流・始動トルクはいずれも約1/3になる。","memory":"Y-Δ始動＝始動電流もトルクも約1/3。","source":"https://jeea.or.jp/course/contents/07102/"},{"id":"2023-04","year":2023,"number":4,"type":"真偽","question":"すべりを考慮しない場合、極数が4極、電源周波数が50Ｈｚの三相誘導電動機の回転数は、1,500min⁻¹である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"同期速度は Ns＝120f/P。50Hz・4極なら120×50÷4＝1,500min⁻¹なので、記述の1,500min⁻¹は正しい。","memory":"同期速度 Ns＝120f/P。50Hz・4極＝1,500min⁻¹。","source":"https://jeea.or.jp/course/contents/07115/"},{"id":"2023-05","year":2023,"number":5,"type":"真偽","question":"フィードバック制御では、制御量と目標値を比較して、偏差を0とするように操作する。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"フィードバック制御は、実際の制御量を目標値と比較し、その偏差を小さくするよう操作量を修正する制御。記述は正しい。","memory":"FB制御＝目標値－実測値の偏差を小さくする。","source":"https://www.fa.omron.co.jp/guide/technicalguide/14/186/index.html"},{"id":"2023-06","year":2023,"number":6,"type":"真偽","question":"保全予防は、保全作業における災害ゼロを目指す活動である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"保全予防は、設備の計画・設計段階から故障しにくく保全しやすい設備にする考え方。保全作業中の災害ゼロ活動そのものを指す用語ではない。","memory":"保全予防＝設計段階から「故障しにくい・保全しやすい」。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2023-07","year":2023,"number":7,"type":"真偽","question":"FMEAは、故障モード影響解析と呼ばれる解析手法である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"FMEAは Failure Mode and Effects Analysis（故障モード影響解析）。想定される故障モードと、その影響を事前に洗い出して評価する手法。","memory":"FMEA＝故障モード→影響を洗い出す。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2023-08","year":2023,"number":8,"type":"真偽","question":"二次故障とは、２つ以上の故障原因の組合せによって生じる故障である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"二次故障は、ある故障が原因となって別の故障を誘発するような故障を指す。「2つ以上の故障原因の組合せ」で定義するものではない。","memory":"二次故障＝先に起きた故障が別の故障を誘発。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2023-09","year":2023,"number":9,"type":"真偽","question":"保全方式の1つであるTBMは、設備の劣化状態によって保全時期を決める方式である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"TBMは Time Based Maintenance（時間基準保全）で、時間・使用回数など一定周期を基準に保全する方式。劣化状態を監視して時期を決めるのはCBM。","memory":"TBM＝時間基準、CBM＝状態基準。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2023-10","year":2023,"number":10,"type":"真偽","question":"MTＢＦとは、ある期間中の総動作時間を総故障数で除した値である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"MTBF（平均故障間隔）は、修理可能な設備について総動作時間を故障回数で割って求める代表的な信頼性指標。記述は正しい。","memory":"MTBF＝総動作時間÷故障回数。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2023-11","year":2023,"number":11,"type":"真偽","question":"バスタブ曲線における摩耗故障期間とは、故障率がほぼ一定と見なすことができる期間のことである。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"故障率がほぼ一定なのは偶発故障期間。摩耗故障期間では部品の劣化・摩耗が進み、時間とともに故障率が上昇する。","memory":"摩耗故障期間＝故障率が上昇。一定なのは偶発故障期。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2023-12","year":2023,"number":12,"type":"真偽","question":"ガントチャートは、工事などの日程計画作成や、実績記入による進捗管理に用いられる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"ガントチャートは、横軸に時間、縦軸に作業項目などを置き、計画期間や実績を棒で示す工程・進捗管理の代表的な方法。","memory":"ガントチャート＝横軸時間、棒で計画と進捗。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2023-13","year":2023,"number":13,"type":"真偽","question":"サージングとは、液体の圧力が下がり、局部的な高い真空が生じて気泡が発生する現象である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"記述はキャビテーションの説明。キャビテーションは局部的な圧力低下で気泡が発生・消滅する現象で、サージングは流量や圧力が周期的に大きく変動する不安定現象。","memory":"気泡発生＝キャビテーション。流量・圧力の周期変動＝サージング。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2023-14","year":2023,"number":14,"type":"真偽","question":"計数抜取検査は、製品の特性値を測定し、その結果から求めた平均値や標準偏差などとロット判定基準を比較し、合否判定する。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"平均値や標準偏差など、測定値を用いて判定するのは計量抜取検査。計数抜取検査は不適合品数・不適合数など「個数」でロットを判定する。","memory":"計数＝個数を数える、計量＝寸法などを測る。","source":"https://www.monodukuri.com/gihou/article/1359"},{"id":"2023-15","year":2023,"number":15,"type":"真偽","question":"パレート図では、データを層別して、数値が大きい順に棒グラフを作成し、累積比率を折れ線グラフで表示する。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"パレート図は項目別の件数などを大きい順に棒で並べ、累積比率を折れ線で重ねる図。重点課題の絞り込みに使う。","memory":"パレート＝大きい順の棒＋累積比率の折れ線。","source":"https://www.monodukuri.com/gihou/article/3048"},{"id":"2023-16","year":2023,"number":16,"type":"真偽","question":"管理図を用いたデータ解析における計量値の例として、故障発生件数が挙げられる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"故障発生件数は「数える」データなので計数値。計量値は長さ、質量、時間など連続的に測定できる値を指す。","memory":"件数・個数＝計数値。長さ・重さ＝計量値。","sourc wer":"×","figure":false,"figureType":"","image":null,"explanation":"焼ならし（焼準）は加熱・保持後、通常は空気中で冷却して組織を整える熱処理。炉内で徐々に冷却する説明は焼なましに近い。","memory":"焼ならし＝空冷、焼なまし＝徐冷。","source":"https://www.netsushori.jp/knowledge/"},{"id":"2023-21","year":2023,"number":21,"type":"真偽","question":"指差呼称とは、対象物を見て指を差し、その名称と状態を声に出して確認することである。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"指差呼称は、対象を目で確認し、指で差し、名称や状態を声に出して確認する安全確認手法。思い込みや見落としの防止に用いる。","memory":"見る＋指差す＋声に出す＝指差呼称。","source":"https://www.jisha.or.jp/zerosai/kyt/index.html"},{"id":"2023-22","year":2023,"number":22,"type":"真偽","question":"フェールセーフ設計は、機械の操作手順を間違えても、あるいは危険性などをよく理解していない作業者が操作しても危険を生じないようにした設計である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"記述はフールプルーフの説明。フェールセーフは機器が故障した場合でも、危険側ではなく安全側に移行するよう設計する考え方。","memory":"人の誤操作対策＝フールプルーフ、故障時に安全側＝フェールセーフ。","source":"https://www.mhlw.go.jp/bunya/roudoukijun/anzeneisei14/dl/press1-5.pdf"},{"id":"2023-23","year":2023,"number":23,"type":"真偽","question":"粉塵障害防止規則において、粉塵作業を行う屋内の作業場所については、毎日1回以上、清掃を行わなければならないと定められている。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"粉じん作業を行う屋内作業場所では、たい積した粉じんを除去するための清掃が求められる。設問の「毎日1回以上」は規則の要点に沿う。","memory":"粉じん作業場＝たい積粉じんを日常的に清掃。","source":"https://www.mhlw.go.jp/web/t_doc_keyword?dataId=74107000&dataType=0&keyword=%E7%B2%89%E3%81%98%E3%82%93%E9%9A%9C%E5%AE%B3%E9%98%B2%E6%AD%A2%E8%A6%8F%E5%89%87&mode=0&pageNo=1"},{"id":"2023-24","year":2023,"number":24,"type":"真偽","question":"Ａ火災とは、木材、紙、繊維などが燃える火災のことである。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"A火災は木材・紙・繊維など普通可燃物の火災。油・ガソリンなどの火災はB火災に分類される。","memory":"A＝普通可燃物、B＝油類、C＝電気設備。","source":"https://www.fdma.go.jp/singi_kento/kento/items/post-53/01/sankou9.pdf"},{"id":"2023-25","year":2023,"number":25,"type":"真偽","question":"切断荷重が6tの吊りワイヤロープ１本で吊れる最大質量は、3tである。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"玉掛け用ワイヤロープは安全率を見込んで使用荷重を決めるため、切断荷重6tをそのまま2で割って3t吊れるとはならない。ワイヤロープの安全係数は原則6以上。","memory":"玉掛けワイヤロープは「切断荷重÷安全係数」で使用荷重を考える。","source":"https://www.mhlw.go.jp/www2/public/kaitou/09_besshi.htm"},{"id":"2023-26","year":2023,"number":26,"type":"4択","question":"誘導電動機の速度制御に関する記述のうち、適切でないものはどれか。","options":{"ア":"極数変換電動機の極数を少ない方から多い方に切り換えることにより回転数が小さくなる。","イ":"一次周波数制御において、周波数を高い方から低い方に切り換えることにより回転数が小さくなる。","ウ":"回生制動において、極数を切り換えても停止までの制動はできない。","エ":"機械制動は、回生制動に比べてエネルギー効率がよい制動方法である。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。機械制動は摩擦などで運動エネルギーを熱として失うため、電源側へエネルギーを戻せる回生制動よりエネルギー効率がよいとはいえない。極数を増やす・周波数を下げると同期速度は低下する。","memory":"誘導機速度 Ns＝120f/P。f↓・P↑で低速、回生制動はエネルギー回収。","source":"https://www.jeea.or.jp/course/contents/09201/"},{"id":"2023-27","year":2023,"number":27,"type":"4択","question":"電動機に関する記述のうち、適切でないものはどれか。","options":{"ア":"サーボモータに適した制御は、クローズドループ方式である。","イ":"同期電動機は、始動トルクがゼロである。","ウ":"三相誘導電動機は、すべりが小さくなるほど回転速度が速くなる。","エ":"同期電動機は、直流電動機に分類される。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。同期電動機は交流電源の周波数に同期して回転する交流電動機で、直流電動機ではない。サーボは閉ループ、誘導機はすべりが小さいほど同期速度に近づく。","memory":"同期電動機＝交流電動機。誘導機は s↓→回転速度↑。","source":"https://jeea.or.jp/course/contents/07115/"},{"id":"2023-28","year":2023,"number":28,"type":"4択","question":"電磁開閉器に関する記述のうち、適切なものはどれか。","options":{"ア":"電磁接触器から熱動形過負荷リレーを外したものである。","イ":"電磁接触器に熱動形過負荷リレーを加えたものである。","ウ":"電磁接触器にヒューズを加えたものである。","エ":"電磁接触器から遮断器を外したものである。"},"answer":"イ","figure":false,"figureType":"","image":null,"explanation":"正解はイ。電磁開閉器（マグネットスイッチ）は、電磁接触器に熱動形過負荷リレー（サーマルリレー）を組み合わせ、開閉と過負荷保護を行う。","memory":"電磁開閉器＝電磁接触器＋サーマルリレー。","source":"https://www.fa.omron.co.jp/guide/technicalguide/753/343/"},{"id":"2023-29","year":2023,"number":29,"type":"4択","question":"電子機器を使用した自動制御に関する記述のうち、適切でないものはどれか。","options":{"ア":"PID制御とは、比例動作、積分動作、および微分動作の３つの動作を含む制御方式である。","イ":"カスケード制御とは、フィードバック制御系において、1つの制御装置の出力信号によって他の制御系の目標値を決定する制御方式である。","ウ":"シーケンス制御とは、あらかじめ定められた順序または手続きに従って制御の各段階を逐次進めていく制御方式である。","エ":"PTP制御とは、あらかじめ定められた変化をする目標値に追従させる制御方式である。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。PTP（Point To Point）制御は、始点から指定した目標点まで位置決めする方式で、途中の軌跡を連続的な目標値に追従させる制御ではない。","memory":"PTP＝点から点へ位置決め。軌跡そのものは基本的に規定しない。","source":"https://www.fa.omron.co.jp/guide/technicalguide/14/186/index.html"},{"id":"2023-30","year":2023,"number":30,"type":"4択","question":"2相式ロータリエンコーダに関する記述のうち、適切なものはどれか。","options":{"ア":"A相とB相は、45°の位相差がある。","イ":"A相とB相は、90°の位相差がある。","ウ":"A相とB相は、同相で、出力電圧が異なる。","エ":"A相を反転したものがB相である。"},"answer":"イ","figure":false,"figureType":"","image":null,"explanation":"正解はイ。2相式インクリメンタルエンコーダのA相とB相は通常90°の位相差を持ち、どちらが先行するかで回転方向を判別できる。","memory":"A/B相＝90°ずれ。先行相で回転方向が分かる。","source":"https://www.fa.omron.co.jp/product/selection/34/func_spec.html"},{"id":"2023-31","year":2023,"number":31,"type":"4択","question":"電気および磁気に関する記述のうち、適切でないものはどれか。","options":{"ア":"透磁率が高いほど、磁束密度は高くなる。","イ":"ガラスとビニールをこすり合わせると両者は互いに引き合う。","ウ":"コンデンサに交流電圧を印加した場合、電流は静電容量に正比例する。","エ":"比透磁率とは、磁性体の温度変化による透磁率の変化の割合のことである。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。比透磁率は物質の透磁率μを真空の透磁率μ₀で割った比（μ/μ₀）であり、「温度変化による透磁率の変化割合」ではない。","memory":"比透磁率 μr＝μ/μ₀。","source":"https://www.keyence.co.jp/ss/products/recorder/lab/glossary/"},{"id":"2023-32","year":2023,"number":32,"type":"4択","question":"電子に関する記述のうち、適切でないものはどれか。","options":{"ア":"摩擦電気は、電子の移動により起きる現象である。","イ":"価電子とは、原子のもっとも外側の軌道にある電子である。","ウ":"原子は、原子核と電子で構成されている。","エ":"原子核は、電子全体と同じ量の負の電気量をもつ。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。原子核は陽子による正の電荷をもち、電子は負の電荷をもつ。中性原子では正負の電気量の大きさがつり合う。","memory":"原子核＝＋、電子＝－。","source":"https://atomica.jaea.go.jp/data/detail/dat_detail_03-06-03-01.html"},{"id":"2023-33","year":2023,"number":33,"type":"4択","question":"直流の電気回路に関する記述のうち、適切でないものはどれか。","options":{"ア":"1Wの電力を1時間使用すると、発生する熱量は、1Jである。","イ":"1Ωの抵抗に1Aの電流を流すために必要な電圧は、1Vである。","ウ":"1秒間に1Cの電荷が移動するときに流れる電流は、1Aである。","エ":"1Vの電圧で1Aの電流が流れたときの電力は、1Wである。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。1W＝1J/sなので、1Wを1時間（3600s）使うとエネルギーは3600J。ほかは V＝IR、I＝Q/t、P＝VI の基本関係に一致する。","memory":"1W×1h＝1Wh＝3600J。","source":"https://www.keyence.co.jp/ss/products/recorder/lab/glossary/"},{"id":"2023-34","year":2023,"number":34,"type":"4択","question":"単相電圧が200Vで、抵抗値が50Ωのヒータを2時間使用したとき、このヒータの消費電力量として、適切なものはどれか。","options":{"ア":"1,600Wh","イ":"2,000Wh","ウ":"2,400Wh","エ":"2,800Wh"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。抵抗負荷なので P＝V²/R＝200²/50＝800W。2時間の電力量は800W×2h＝1,600Wh。","memory":"抵抗負荷：P＝V²/R、電力量＝P×時間。","source":"https://www.keyence.co.jp/ss/products/recorder/lab/glossary/"},{"id":"2023-35","year":2023,"number":35,"type":"4択","question":"パルスに関する記述のうち、適切でないものはどれか。","options":{"ア":"パルス発生器には、無安定マルチバイブレータなどが用いられる。","イ":"電流形インバータの制御には、パルス幅変調方式が用いられる。","ウ":"パルス符号変調方式は、雑音に強い。","エ":"パルス増幅回路は、映像増幅回路などに用いられる。"},"answer":"イ","figure":false,"figureType":"","image":null,"explanation":"正解はイ。電流形インバータは直流側の電流を平滑して扱う方式で、一般的なPWM（パルス幅変調）は電圧形インバータで広く用いられる。無安定マルチバイブレータはパルス発生に利用される。","memory":"PWMは「ON幅を変える」制御。電圧形インバータで広く使う。","source":"https://www.keyence.co.jp/ss/products/recorder/lab/glossary/"},{"id":"2023-36","year":2023,"number":36,"type":"4択","question":"下図に示す排他的論理和回路の真理値として、適切なものはどれか。","options":{"ア":"A=0 B=0 X=1","イ":"A=0 B=1 X=0","ウ":"A=1 B=0 X=0","エ":"A=1 B=1 X=0"},"answer":"エ","figure":true,"figureType":"図","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAa0AAAClCAMAAADYrFLcAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAL9UExURf////7+/v39/fz8/Pv7++7u7uLi4t/f3+Dg4Ofn5+vr6+/v7/Hx8fT09Pf39/n5+fr6+vX19a6urnR0dGdnZ2hoaGlpaWtra3Jycn9/f46OjpqamqSkpLKysr+/v8vLy9fX1+Hh4ejo6LOzs6GhodDQ0Hx8fB8fHwsLCxUVFSMjIyIiIiQkJCgoKCwsLDAwMDk5OUNDQ1FRUWZmZnt7e4+Pj6Ojo7a2tsnJydnZ2ebm5vb29kVFRYWFhdra2qKiojo6OhERETc3N2xsbICAgGRkZF1dXVRUVEZGRi4uLiYmJikpKTExMUBAQFdXV29vb4uLi6ampsDAwNbW1vLy8vj4+JycnDw8PCsrK0REROrq6unp6ePj49XV1c/Pz8LCwn5+flNTUz4+Pi0tLUhISIqKiq+vr "測定レンジは、テスト棒を測定回路に接続して切り替える。","エ":"電圧・電流を測定する際は、最大測定レンジから順次下位に切り替えて測定する。"},"answer":"ウ","figure":false,"figureType":"","image":null,"explanation":"正解はウ。測定レンジの切替は測定回路へ接続する前に行い、未知の電圧・電流は最大レンジから始めて徐々に下げるのが基本。接続中の不用意な切替は危険。","memory":"未知量は最大レンジから。レンジ切替は安全を確保してから。","source":"https://www.hioki.co.jp/jp/learning/tester/"},{"id":"2023-38","year":2023,"number":38,"type":"4択","question":"アルミ電解コンデンサの推定寿命に関する文中の（   ）内に当てはまる数値として、適切なものはどれか。「アレニウスの法則によると、アルミ電解コンデンサは、使用温度が10℃上がると推定寿命は(  )倍となる。」","options":{"ア":"1/4","イ":"1/2","ウ":"2","エ":"4"},"answer":"イ","figure":false,"figureType":"","image":null,"explanation":"正解はイ。アレニウス則を用いた目安では、使用温度が10℃上がると寿命は約1/2、10℃下がると約2倍になる。","memory":"電解コンデンサ：10℃低下で寿命約2倍（10℃上昇で1/2）。","source":"https://www.nichicon.co.jp/english/wp-content/uploads/CAT.8101.pdf"},{"id":"2023-39","year":2023,"number":39,"type":"4択","question":"3,600min⁻¹で回転するモータとモータの架台が同じ周波数で振動した場合、架台の振動周波数として、適切な数値はどれか。","options":{"ア":"24Hz","イ":"40Hz","ウ":"60Hz","エ":"80Hz"},"answer":"ウ","figure":false,"figureType":"","image":null,"explanation":"正解はウ。回転数を振動周波数へ直すには min⁻¹（rpm）を60で割る。3,600÷60＝60Hz。","memory":"回転1次振動の周波数[Hz]＝回転数[min⁻¹]÷60。","source":"https://www.keyence.co.jp/ss/products/recorder/lab/glossary/"},{"id":"2023-40","year":2023,"number":40,"type":"4択","question":"ソレノイドコイルに関する文中の（   ）内に当てはまる文章として、適切なものはどれか。「ソレノイドコイルの温度が上昇すると、（   ）。」","options":{"ア":"コイル抵抗が小さくなるため、吸引力が増加する","イ":"コイル抵抗が小さくなるため、吸引力が減少する","ウ":"コイル抵抗が大きくなるため、吸引力が増加する","エ":"コイル抵抗が大きくなるため、吸引力が減少する"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。銅線は温度上昇で抵抗が増える。一定電圧なら I＝V/R により電流が減り、コイルの磁力・吸引力も低下する。","memory":"コイル温度↑→銅抵抗↑→電流↓→吸引力↓。","source":"https://www.keyence.co.jp/ss/products/recorder/lab/glossary/"},{"id":"2023-41","year":2023,"number":41,"type":"4択","question":"ノイズの除去に関する記述のうち、適切でないものはどれか。","options":{"ア":"静電誘導ノイズ対策をする場合、シールド線を両端で確実に接地する。","イ":"信号線を撚り合わせて電磁誘導ノイズを打ち消す。","ウ":"ケーブルに銅テープを巻き、接地する。","エ":"動力線の接地場所と信号線の接地場所は、別に設ける。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。静電誘導ノイズ対策のシールドは、低周波信号では一般に片端接地としてグランドループを避ける。ツイストペアは電磁誘導ノイズの相殺に有効。","memory":"静電ノイズ＝シールド、電磁ノイズ＝ツイスト。低周波シールドは片端接地が基本。","source":"https://www.keyence.co.jp/ss/products/measure-sys/measurement-selection/noise.jsp"},{"id":"2023-42","year":2023,"number":42,"type":"4択","question":"リレーの接点が復帰しない場合の原因推定方法として、適切でないものはどれか。","options":{"ア":"リレーの接点が溶着していないか調べる。","イ":"迂回路によって電圧が印加していないか調べる。","ウ":"供給電源側のブレーカが落ちていないか調べる。","エ":"リレーが機械的破損していないか調べる。"},"answer":"ウ","figure":false,"figureType":"","image":null,"explanation":"正解はウ。接点が復帰しない原因なら、接点溶着、コイルへの回り込み電圧、機械的な引っ掛かりなどを疑う。供給側ブレーカの遮断はむしろ励磁を止める方向。","memory":"復帰しない＝溶着・残留電圧・機械的固着を疑う。","source":"https://www.fa.omron.co.jp/guide/technicalguide/36/287/index.html"},{"id":"2023-43","year":2023,"number":43,"type":"4択","question":"クランプメータで負荷電流を測定する場合の測定方法として、適切なものはどれか。","options":{"ア":"三相線路の場合、3相分の電線を、クランプの中心に閉じて測定する。","イ":"単相線路の場合、2相分の電線を、クランプの中心に閉じて測定する。","ウ":"三相線路、単相線路のどちらの場合でも、1相分の電線を、クランプの中心に閉じて測定する。","エ":"三相線路、単相線路のどちらの場合でも、2相分の電線を、クランプの中心に閉じて測定する。"},"answer":"ウ","figure":false,"figureType":"","image":null,"explanation":"正解はウ。負荷電流を測るときは1本（1相）の導体だけをクランプする。往復する複数導体をまとめて挟むと磁束が相殺され、負荷電流を正しく読めない。","memory":"負荷電流は1本だけクランプ。複数本まとめると相殺。","source":"https://www.hioki.co.jp/jp/learning/clamp/"},{"id":"2023-44","year":2023,"number":44,"type":"4択","question":"下図のリレーシーケンス回路の名称として、適切なものはどれか。","options":{"ア":"操作順序回路","イ":"遅延回路","ウ":"フリップフロップ回路","エ":"早押し優先回路"},"answer":"イ","figure":true,"figureType":"図","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAdsAAACPCAMAAACFzIFTAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAALHUExURf////7+/v39/fz8/Pr6+vj4+PT09OHh4fX19fb29tfX1+Xl5fn5+eLi4q6urq2trebm5o+Pj7e3t/Ly8vv7+9nZ2ZKSkpGRkd7e3t/f32pqap+fn+/v79ra2pWVlZOTk+Dg4G1tbaGhoff398PDw7q6usDAwNDQ0Ojo6MTExMHBwezs7PHx8WdnZ2RkZG5ubnBwcH5+fqurq5ycnG9vb3p6en9/f3Nzc3x8fLa2tvDw8Ovr61NTU4GBgaamppqammxsbLOzs+7u7tbW1oKCgrS0tF5eXtHR0b6+vqCgoGFhYYmJic/Pz11dXby8vJSUlLu7u+np6aSkpGZmZoaGhnFxcbGxsdPT03h4eOrq6s7OzsLCwsnJyX19fbKyslFRUVdXV+Tk5Hl5eXt7e3V1dV9fX0pKSmVlZYCAgHZ2dt /jeea.or.jp/course/contents/12143/"},{"id":"2024-04","year":2024,"number":4,"type":"真偽","question":"SSR（ソリッドステートリレー）は、無接点リレーの一種である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"SSRは半導体素子で負荷をオン・オフする無接点リレー。機械接点がないため、接点摩耗がなく高速開閉に向く。","memory":"SSR＝半導体式の無接点リレー。","source":"https://www.fa.omron.co.jp/guide/technicalguide/18/77/"},{"id":"2024-05","year":2024,"number":5,"type":"真偽","question":"カスケード制御とは、1つの制御装置の出力信号によって他の制御系の目標値を決定する制御である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"カスケード制御は、主制御器の出力を副制御系の目標値として用いる多重ループ制御。外乱の影響を早く抑えやすい。","memory":"カスケード＝主ループ出力→副ループの目標値。","source":"https://www.fa.omron.co.jp/guide/technicalguide/14/186/index.html"},{"id":"2024-06","year":2024,"number":6,"type":"真偽","question":"改良保全とは、設備を使用開始前の状態に戻す保全方式である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"改良保全は、故障しにくさ・保全しやすさを高めるため設備そのものを改良する活動。単に導入時の状態へ戻すのは復元的な保全。","memory":"改良保全＝元に戻すのではなく、より良く改造。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2024-07","year":2024,"number":7,"type":"真偽","question":"解析方法の1つであるFMEAは、故障の木解析と呼ばれる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"故障の木解析はFTA（Fault Tree Analysis）。FMEAは故障モードとその影響をボトムアップ的に洗い出す手法なので、記述は誤り。","memory":"FMEA＝故障モード影響解析、FTA＝故障の木解析。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2024-08","year":2024,"number":8,"type":"真偽","question":"設備の時間稼働率(%)は下記の式で求められる。稼働時間 ÷ 負荷時間 × 100","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"時間稼働率は、負荷時間のうち実際に設備が稼働した時間の割合で、稼働時間÷負荷時間×100で求める。","memory":"時間稼働率＝稼働時間÷負荷時間×100。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2024-09","year":2024,"number":9,"type":"真偽","question":"故障のメカニズムとは、機械が故障してから、生産活動に影響が及ぶまでの過程である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"故障メカニズムは、物理的・化学的な劣化などによって故障に至る仕組み・過程を指す。故障後に生産へ影響が及ぶまでの過程ではない。","memory":"故障メカニズム＝「なぜ・どう壊れたか」の仕組み。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2024-10","year":2024,"number":10,"type":"真偽","question":"MTＢＦとは、ある期間中の総動作時間を総故障数で除した値である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"MTBF（平均故障間隔）は、修理可能な設備について総動作時間を故障回数で割って求める代表的な信頼性指標。記述は正しい。","memory":"MTBF＝総動作時間÷故障回数。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2024-11","year":2024,"number":11,"type":"真偽","question":"バスタブ曲線における摩耗故障期間とは、故障率がほぼ一定と見なすことができる期間のことである。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"故障率がほぼ一定なのは偶発故障期間。摩耗故障期間では部品の劣化・摩耗が進み、時間とともに故障率が上昇する。","memory":"摩耗故障期間＝故障率が上昇。一定なのは偶発故障期。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2024-12","year":2024,"number":12,"type":"真偽","question":"ライフサイクルコストとは、設備の運用中にかかった保全費用の合計である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"LCCは設備の導入時費用だけでなく、運用・保全・エネルギー・廃棄など生涯にわたる費用を総合したもの。運用中の保全費だけではない。","memory":"LCC＝取得～運用・保全～廃棄まで全部。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2024-13","year":2024,"number":13,"type":"真偽","question":"エロージョンとは、配管のエルボなどの曲がり部分の内面が、流体の摩擦作用により徐々に摩耗する機械的な浸食現象である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"エロージョンは、高速流体や流体中の粒子などによって材料表面が機械的に侵食・摩耗する現象。配管曲がり部などで起こりやすい。","memory":"エロージョン＝流れによる機械的侵食。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2024-14","year":2024,"number":14,"type":"真偽","question":"抜取検査では、同一の生産条件で生産された製品の集まりについて、無作為に一部を取り出して検査をする。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"抜取検査は、ロット全部ではなく無作為に一部を抜き取り、その結果からロットの合否を判定する検査方法。","memory":"抜取検査＝ロットからランダムに一部を検査。","source":"https://www.monodukuri.com/gihou/article/1359"},{"id":"2024-15","year":2024,"number":15,"type":"真偽","question":"正規分布において、平均値μ±3σ内にデータが現れる確率は97%である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"正規分布では平均μ±3σの範囲に入る確率は約99.73%。97%ではない。","memory":"正規分布：±1σ≈68.3%、±2σ≈95.4%、±3σ≈99.73%。","source":"https://www.monodukuri.com/gihou/article/3039"},{"id":"2024-16","year":2024,"number":16,"type":"真偽","question":"管理図を用いたデータ解析における計数値の例として、故障発生件数が挙げられる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"故障発生件数は個数を数えるデータなので計数値。記述は正しい。","memory":"件数は計数値。","source":"https://www.monodukuri.com/gihou/article/1359"},{"id":"2024-17","year":2024,"number":17,"type":"真偽","question":"np管理図は、不適合品率を管理する場合に用いる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"np管理図はサンプル中の「不適合品数」を管理する管理図。不適合品率を管理するのはp管理図。","memory":"np＝不適合品数、p＝不適合品率。","source":"https://www.monodukuri.com/gihou/article/1359"},{"id":"2024-18","year":2024,"number":18,"type":"真偽","question":"ステンレス鋼は、炭素を10.5％以上含む合金鋼である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"10.5%以上として基準になる主元素は炭素ではなくクロム。クロムによる不動態皮膜がステンレスの耐食性を支える。","memory":"ステンレスの10.5%以上＝CではなくCr。","source":"https://www.jssa.gr.jp/contents/about_stainless/"},{"id":"2024-19","year":2024,"number":19,"type":"真偽","question":"アルミニウムは、鉄に比べ融点が低い。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"アルミニウムの融点は約660℃で、鉄より大幅に低い。したがって「鉄より融点が高い」は誤り。","memory":"Alの融点≈660℃。鉄より低い。","source":"https://www.aluminum.or.jp/wp-content/themes/dp-colors/img/Alumimuseum.pdf"},{"id":"2024-20","year":2024,"number":20,"type":"真偽","question":"鋼の焼入れは、鋼を硬化させ、強度を高めるために行う。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"焼入れは鋼を適切な温度に加熱後、急冷して硬い組織を得る熱処理で、硬さ・強度を高める目的で行う。","memory":"焼入れ＝加熱→急冷→硬化。","source":"https://www.netsushori.jp/knowledge/"},{"id":"2024-21","year":2024,"number":21,"type":"真偽","question":"フールプルーフ設計は、機械の操作手順を間違えても、あるいは危険性などをよく理解していない作業者が操作しても危険が生じないようにした設計である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"フールプルーフは、誤操作や知識不足があっても危険な状態にならないよう機構・手順を設計する考え方。記述は正しい。","memory":"フールプルーフ＝人が間違えても危険にしない。","source":"https://www.mhlw.go.jp/bunya/roudoukijun/anzeneisei14/dl/press1-5.pdf"},{"id":"2024-22","year":2024,"number":22,"type":"真偽","question":"職業性疾病の原因となるＶＤＴ作業の例として、パソコンを用いたデータ入力が挙げられる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"パソコンなどの表示画面を見ながら行うデータ入力は、情報機器を用いた代表的な画面作業に当たる。作業環境や休止時間への配慮が必要。","memory":"PC画面を使うデータ入力＝代表的なVDT/情報機器作業。","source":"https://www.mhlw.go.jp/content/000539604.pdf"},{"id":"2024-23","year":2024,"number":23,"type":"真偽","question":"空気中の酸素濃度が16%の場合、酸素欠乏状態にあるといえる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"酸素欠乏は空気中の酸素濃度が18%未満の状態。16%は18%を下回るため酸素欠乏状態。","memory":"酸欠＝酸素18%未満。","source":"https://www.mhlw.go.jp/web/t_doc?dataId=74105000&dataType=0&pageNo=1"},{"id":"2024-24","year":2024,"number":24,"type":"真偽","question":"B火災とは、木材、紙、繊維などが燃える火災のことである。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"木材・紙・繊維などはA火災。B火災は石油・ガソリンなど引火性液体を中心とする火災なので、記述は誤り。","memory":"A＝木・紙、B＝油。","source":"https://www.fdma.go.jp/singi_kento/kento/items/post-53/01/sankou9.pdf"},{"id":"2024-25","year":2024,"number":25,"type":"真偽","question":"クレーン等安全規則によると、玉掛け作業において、ワイヤロープの直径の減少が公称径の7%を超えるものは使用不可である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"玉掛け用ワイヤロープは、直径の減少が公称径の7%を超えるものを使用してはならない。記述は正しい。","memory":"玉掛けワイヤ：径の減少7%超は使用不可。","source":"https://www.mhlw.go.jp/www2/public/kaitou/09_besshi.htm"},{"id":"2024-26","year":2024,"number":26,"type":"4択","question":"誘導電動機の速度制御に関する記述のうち、適切なものはどれか。","options":{"ア":"回生制動において、極数を切り換えても停止までの制動はできない。","イ":"機械制動は、回生制動に比べてエネルギー効率がよい制動方法である。","ウ":"極数変換電動機の極数を多い方から少ない方に切り換えることにより回転数が小さくなる。","エ":"一次周波数制御において、周波数を低い方から高い方に切り換えることにより回転数が小さくなる。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。回生制動は電動機を発電機として電源側へエネルギーを返す制動で、一般に停止直前まで十分な制動トルクを保てず、単独で完全停止させる方式ではない。","memory":"回生制動＝発電して電源へ返す。停止保持は別の制動が必要。","source":"https://www.jeea.or.jp/course/contents/09201/"},{"id":"2024-27","year":2024,"number":27,"type":"4択","question":"電動機に関する記述のうち、適切でないものはどれか。","options":{"ア":"サーボモータに適した制御は、クローズドループ方式である。","イ":"同期電動機は、始動トルクがゼロである。","ウ":"三相誘導電動機は、すべりが小さくなるほど回転速度が速くなる。","エ":"同期電動機は、直流電動機に分類される。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。同期電動機は交流電源の周波数に同期して回転する交流電動機で、直流電動機ではない。サーボは閉ループ、誘導機はすべりが小さいほど同期速度に近づく。","memory":"同期電動機＝交流電動機。誘導機は s↓→回転速度↑。","source":"https://jeea.or.jp/course/contents/07115/"},{"id":"2024-28","year":2024,"number":28,"type":"4択","question":"一次巻線の巻数が200、二次巻線の巻数が100の理想的変圧器がある。この変圧器の一次側に2Aの電流が流れたとき、二次側に流れる電流として、適切なものはどれか。","options":{"ア":"1A","イ":"2A","ウ":"3A","エ":"4A"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。理想変圧器では V₁/V₂＝N₁/N₂、電流比は逆比で I₂/I₁＝N₁/N₂。200/100＝2なので I₂＝2A×2＝4A。","memory":"変圧器：電圧は巻数比、電流は逆比。","source":"https://jeea.or.jp/course/contents/02101/"},{"id":"2024-29","year":2024,"number":29,"type":"4択","question":"電子機器を使用した自動制御に関する記述のうち、適切なものはどれか。","options":{"ア":"PID制御とは、比例動作、積分動作、および微分動作の３つの動作を含む制御方式である。","イ":"予測制御とは、制御量を目標値と比較し、それらを一致させるように操作量を生成する制御方式である。","ウ":"フィードフォワード制御とは、あらかじめ定められた順序または手続きに従って制御の各段階を逐次進めていく制御方式である。","エ":"PTP制御とは、あらかじめ定められた変化をする目標値に追従させる制御方式である。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。PID制御は比例（P）・積分（I）・微分（D）の3動作を組み合わせたフィードバック制御。ほかの選択肢は制御方式の定義が入れ替わっている。","memory":"PID＝P(比例)＋I(積分)＋D(微分)。","source":"https://www.fa.omron.co.jp/guide/technicalguide/14/186/index.html"},{"id":"2024-30","year":2024,"number":30,"type":"4択","question":"2相式ロータリエンコーダに関する記述のうち、適切でないものはどれか。","options":{"ア":"インクリメンタル方式は、電源遮断時の位置を記憶できる。","イ":"アブソリュート方式は、電源遮断時の位置を記憶できる。","ウ":"インクリメンタル方式は、回転方向を検出できる。","エ":"アブソリュート方式は、回転方向を検出できる。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はイ。2相式インクリメンタルエンコーダのA相とB相は通常90°の位相差を持ち、どちらが先行するかで回転方向を判別できる。","memory":"A/B相＝90°ずれ。先行相で回転方向が分かる。","source":"https://www.fa.omron.co.jp/product/selection/34/func_spec.html"},{"id":"2024-31","year":2024,"number":31,"type":"4択","question":"電気および磁気に関する記述のうち、適切なものはどれか。","options":{"ア":"コンデンサに交流電圧を印加した場合、電流は静電容量に正比例する。","イ":"比透磁率とは、磁性体の温度変化による透磁率の変化の割合のことである。","ウ":"物質中の2つの電荷の間に働く力は電荷間の距離に比例する。","エ":"磁力線は、Ｓ極から出てＮ極に入る。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。交流でコンデンサに流れる電流は I＝2πfCV（正弦波・定常時）で、周波数と電圧が一定なら静電容量Cに比例する。磁力線は外部ではN極からS極へ向かう。","memory":"コンデンサ電流 I＝2πfCV。C↑で電流↑。","source":"https://industrial.panasonic.com/jp/ds/ss/technical/b2"},{"id":"2024-32","year":2024,"number":32,"type":"4択","question":"電子に関する記述のうち、適切なものはどれか。","options":{"ア":"価電子とは、原子のもっとも外側の軌道にある電子である。","イ":"自由電子の数が多い物質を絶縁体という。","ウ":"帯電した物質が持つ電気の量（電荷）の単位は、［Q］である。","エ":"電子1個は、約3×10⁸Ｃの正の電気量をもつ。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。価電子は原子の最外殻にある電子。電荷の単位はC（クーロン）で、電子1個の電荷は約−1.602×10⁻¹⁹C。","memory":"価電子＝最外殻電子。電子1個≈−1.60×10⁻¹⁹C。","source":"https://atomica.jaea.go.jp/data/detail/dat_detail_03-06-03-01.html"},{"id":"2024-33","year":2024,"number":33,"type":"4択","question":"リアクタンスに関する文中の（     ）内の数字に当てはまる語句の組合せとして、適切なものはどれか｡「リアクタンスとは、交流回路のコイルやコンデンサにおける( ① )と( ② )の比である。」","options":{"ア":"①:電圧    ②:電流","イ":"①:電圧    ②:抵抗","ウ":"①:周波数 ②:電流","エ":"①:周波数 ②:抵抗"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。リアクタンスは交流に対するコイルやコンデンサの抵抗的な働きを表し、電圧と電流の比 V/I としてΩで表す。","memory":"リアクタンス X＝V/I、単位Ω。","source":"https://jeea.or.jp/course/contents/12142/"},{"id":"2024-34","year":2024 :false,"figureType":"","image":null,"explanation":"正解はア。相互干渉対策では、センサ間隔を空ける、光軸をずらす、感度を適切に下げる、干渉防止機能を使うなどが基本。設問ではスリットで光の広がりを抑える方法が不適切とされる。","memory":"光電センサ干渉対策＝距離・光軸・感度・干渉防止機能。","source":"https://www.keyence.co.jp/ss/products/sensor/sensorbasics/fb_trouble/measures4.jsp"},{"id":"2024-39","year":2024,"number":39,"type":"4択","question":"リレーのうなりの原因として、適切でないものはどれか。","options":{"ア":"DCタイプをACラインで使用","イ":"可動片と鉄心間の異物混入","ウ":"接点への過電流","エ":"電源電圧の変動"},"answer":"ウ","figure":false,"figureType":"","image":null,"explanation":"正解はウ。リレーのうなりは、電源条件の不適合、交流/直流仕様違い、鉄心部の異物など磁気回路側で起こりやすい。接点への過電流は焼損・溶着の原因にはなるが、うなりの直接原因ではない。","memory":"うなり＝コイル/鉄心/電源側、過電流＝接点焼損・溶着側。","source":"https://www.fa.omron.co.jp/guide/technicalguide/36/287/index.html"},{"id":"2024-40","year":2024,"number":40,"type":"4択","question":"高調波の影響によって生じる現象と、その現象が発生する機器の組合せとして、適切でないものはどれか。","options":{"ア":"現象：焼損    機器：コンデンサ","イ":"現象：焼損    機器：リアクトル","ウ":"現象：誤動作   機器：漏電遮断器","エ":"現象：誤動作   機器：電磁接触器"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。高調波はコンデンサやリアクトルの過熱・焼損、漏電遮断器など電子機器の誤動作を生じさせることがある。設問では電磁接触器の誤動作との組合せが不適切。","memory":"高調波＝コンデンサ/リアクトル過熱、電子保護機器の誤動作に注意。","source":"https://jeea.or.jp/course/contents/12144/"},{"id":"2024-41","year":2024,"number":41,"type":"4択","question":"トランジスタ出力（シンク出力タイプ）方式のプログラマブルコントローラに負荷を接続し、プログラマブルコントローラから制御する場合、適切なものはどれか。","options":{"ア":"ア","イ":"イ","ウ":"ウ","エ":"エ"},"answer":"ア","figure":true,"figureType":"選択肢が図","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZAAAAOHCAYAAAAJ8xXGAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAAJcEhZcwAAEnQAABJ0Ad5mH3gAAM4vSURBVHhe7J0HuBPV1obBevU227X33nvBhr0AdkUUFEVQEaQoTaQK0qQXFaQIohQRERFFBBHp1UYVpSkgKKJiveq//vtuMsc5YXJKTsok+d7n2c85mSSTyWRmf3uVvXYpE0IIIeJAAiKEECIuJCBCCCHiQgIihBAiLiQgQggh4kICIoQQIi4kIEIIIeJCAiKEECIuJCBCCCHiQgIihBAiLiQgQggh4kICIoQQIi4kIEIIIeJCAiKEECIuJCBCCCHiQgIihBAiLiQgQggh4kICIoQQIi4kIEL4+L//+z/7448/Cm1//vln5B1/vSdoG389irrvoPcUto3P9u8jVot+T1G/R2GtqN89aFthrbD9eN89aFthLfo9/u8BvCbouxXWgt7j/6ygbfEcc7qRgAjh47fffrM77rjDLr/88pjtss シンク出力（NPN形）は出力ON時に負荷電流を0V側へ吸い込む構成。負荷は＋側とPLC出力端子の間に接続し、電流は＋V→負荷→出力トランジスタ→0Vへ流れる。","memory":"シンク出力＝NPN、負荷は＋側、出力が0V側へ電流を吸い込む。","source":"https://techweb.rohm.co.jp/product/transistors-diodes/transistors/23727/"},{"id":"2024-42","year":2024,"number":42,"type":"4択","question":"正常運転していた三相誘導電動機が異常発熱した。この場合の対応処置として、適切でないものはどれか。","options":{"ア":"電磁開閉器を点検する。","イ":"接地状態を点検する。","ウ":"欠相していないかを点検する。","エ":"電源電圧を点検する。"},"answer":"イ","figure":false,"figureType":"","image":null,"explanation":"正解はイ。異常発熱なら欠相、電源電圧、電磁開閉器の接触不良・導通など、電流増加や不平衡につながる要因を優先確認する。接地状態は重要な安全項目だが、通常は発熱原因の直接確認項目ではない。","memory":"モータ発熱＝欠相・電圧異常・接触不良をまず確認。","source":"https://jeea.or.jp/course/contents/07115/"},{"id":"2024-43","year":2024,"number":43,"type":"4択","question":"電気設備に関する技術基準を定める省令において、絶縁電線の接続の条件として、適切でないものはどれか。","options":{"ア":"接続箇所は、その絶縁電線と同等以上の絶縁効力のあるもので十分に被覆する。","イ":"接続箇所には、接続管その他の器具を使用する、またはろう付けする。","ウ":"電線の電気抵抗を増加させない。","エ":"電線の引張強度を30%以上減少させない。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。電線接続では電気抵抗を増加させず、十分な機械的強度と絶縁を確保する必要がある。引張強度の低下は原則20%以下が基準で、「30%以上減少させない」は不適切。","memory":"電線接続＝抵抗を増やさない・強度低下20%以内・同等以上に絶縁。","source":"https://elaws.e-gov.go.jp/document?lawid=409M50000400052"},{"id":"2024-44","year":2024,"number":44,"type":"4択","question":"下図に示す固定抵抗器において、抵抗値の許容差を示す箇所として、適切なものはどれか。","options":{"ア":"A","イ":"B","ウ":"C","エ":"D"},"answer":"エ","figure":true,"figureType":"図","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAb8AAAB2CAMAAABvXW2IAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAL3UExURf///+bm5oiIiIqKiunp6f7+/tbW1qysrKSkpKWlpbe3t9PT0+vr6/f39/v7+/T09OHh4c/Pz87OzvPz8/r6+rGxsaampsXFxejo6P39/Z2dnRUVFRsbG8DAwGtray4uLhcXFxgYGCkpKTs7Ozw8PDo6OjIyMj09PXd3d+Dg4Pz8/KioqFJSUjg4OEFBQU1NTU9PT0lJSUxMTJiYmNTU1O7u7tjY2Hx8fBkZGSQkJDk5OUdHRz8/P1dXV6urq+3t7V1dXQMDA2RkZPDw8PX19eLi4oaGhgICAggICHBwcNra2t7e3tzc3Lu7u1lZWRAQEA0NDV5eXuPj41hYWBwcHGJiYqqqqtfX193d3cjIyH9/fzU1NRQUFIWFhfn5+ampqREREQEBAc3NzaCgoBYWFltbW8LCwisrKwAAAC8vLwoKCoGBgUhISKKiou/v7729vcrKylxcXOzs7JeXlxoaGjY2NvHx8Xt7ewwMDAUFBX5 e":null,"explanation":"FTAはトップ事象（故障）から原因を樹形図で遡り、論理的に原因を分析するトップダウン型の解析手法。記述は正しい。","memory":"FTA＝トップ事象から原因へ、樹形図でトップダウン。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2025-08","year":2025,"number":8,"type":"真偽","question":"修理できない機械が、稼働してから故障するまでの平均時間をＭＴＴＦという。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"MTTFは Mean Time To Failure。修理を前提としない機器が使用開始から故障するまでの平均時間を表す。","memory":"MTTF＝非修理系の平均故障時間。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2025-09","year":2025,"number":9,"type":"真偽","question":"バスタブ曲線における摩耗故障期間とは、設備を使用開始後の比較的早い時期に、設計・製造上の不具合や、使用環境の不適合などによって故障が発生する期間のことである。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"使用開始直後の比較的早い時期に故障率が高いのは初期故障期間。摩耗故障期間は寿命末期で劣化・摩耗が進み、故障率が増加する期間。","memory":"バスタブ曲線＝初期↓ → 偶発ほぼ一定 → 摩耗↑。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2025-10","year":2025,"number":10,"type":"真偽","question":"機械のメンテナンスのために消費される補助材料や工場消耗品の費用は、直接材料費に分類される。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"保全用の補助材料や工場消耗品は、特定製品へ直接ひも付ける直接材料費ではなく、一般に間接材料費として扱う。","memory":"製品に直接ひも付かない消耗品＝間接材料費。","source":"https://costaccounting.tokyo/?p=96"},{"id":"2025-11","year":2025,"number":11,"type":"真偽","question":"Vベルトを用いる際は、ベルトと、プーリの溝底との間にすき間を設ける。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"Vベルトはプーリ溝の側面で摩擦力を伝えるため、正常時はベルト底と溝底にすき間がある。底付きすると十分な摩擦力が得られない。","memory":"Vベルトは「側面で伝動」。溝底には触れさせない。","source":"https://www.mitsuboshi.com/japan/product/belt/vbelt/"},{"id":"2025-12","year":2025,"number":12,"type":"真偽","question":"サージングとは、液体の圧力が下がり、局部的な高い真空が生じて気泡が発生する現象である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"記述はキャビテーションの説明。キャビテーションは局部的な圧力低下で気泡が発生・消滅する現象で、サージングは流量や圧力が周期的に大きく変動する不安定現象。","memory":"気泡発生＝キャビテーション。流量・圧力の周期変動＝サージング。","source":"https://www.jipm.or.jp/business/facility/"},{"id":"2025-13","year":2025,"number":13,"type":"真偽","question":"ウォータハンマの対策として、配管内を流れる液体の流速を変動させることが挙げられる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"ウォータハンマは弁の急閉などで流速が急変し、圧力波が生じる現象。対策は急激な流速変化を抑えることであり、流速を変動させること自体は対策にならない。","memory":"ウォータハンマ対策＝流速を急変させない。","source":"https://www.kitz.co.jp/product/waterhammer/"},{"id":"2025-14","year":2025,"number":14,"type":"真偽","question":"抜取検査では、同一の生産条件で生産された製品の集まりについて、無作為に一部を取り出して検査する。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"抜取検査は、ロット全部ではなく無作為に一部を抜き取り、その結果からロットの合否を判定する検査方法。","memory":"抜取検査＝ロットからランダムに一部を検査。","source":"https://www.monodukuri.com/gihou/article/1359"},{"id":"2025-15","year":2025,"number":15,"type":"真偽","question":"ヒストグラムでは、データを層別して、大きい順に棒グラフを作成し、累積比率を折れ線グラフで表示する。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"「大きい順の棒＋累積比率の折れ線」はパレート図。ヒストグラムは測定値を階級に分け、各階級の度数を棒で表して分布形状を見る。","memory":"ヒストグラム＝度数分布、パレート＝大きい順＋累積。","source":"https://www.monodukuri.com/gihou/article/3039"},{"id":"2025-16","year":2025,"number":16,"type":"真偽","question":"正規分布は、平均値と分散によって定まる左右対称の分布である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"正規分布は平均値を中心に左右対称で、位置を平均、広がりを分散（標準偏差）が決める分布。記述は正しい。","memory":"正規分布＝平均で中心、分散で広がり。","source":"https://www.monodukuri.com/gihou/article/3039"},{"id":"2025-17","year":2025,"number":17,"type":"真偽","question":"下表のデータでX-R管理図を作成する場合、Rは10である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":true,"figureType":"表","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAZ0AAABXCAMAAADoBWj2AAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAL9UExURf///wAAAB4eHjAwMGlpaTk5OQQEBF5eXkdHRwMDA1JSUmRkZA0NDSwsLC8vLw8PDzs7OwUFBVtbWwcHB3Z2doqKiggICObm5qurq8nJyfHx8WxsbHJyciQkJOXl5ZGRkQwMDN/f3xAQEHR umimuseum.pdf"},{"id":"2025-20","year":2025,"number":20,"type":"真偽","question":"鋼の焼入れは、鋼を硬化させ、強度を高めるために行う。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"焼入れは鋼を適切な温度に加熱後、急冷して硬い組織を得る熱処理で、硬さ・強度を高める目的で行う。","memory":"焼入れ＝加熱→急冷→硬化。","source":"https://www.netsushori.jp/knowledge/"},{"id":"2025-21","year":2025,"number":21,"type":"真偽","question":"フールプルーフ設計は、設備が故障しても、安全側に作動するように配慮した設計のことである。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"「設備が故障しても安全側に作動」はフェールセーフの説明。フールプルーフは、人が誤操作しても危険状態にならないようにする設計。","memory":"誤操作対策＝フールプルーフ、故障対策＝フェールセーフ。","source":"https://www.mhlw.go.jp/bunya/roudoukijun/anzeneisei14/dl/press1-5.pdf"},{"id":"2025-22","year":2025,"number":22,"type":"真偽","question":"リスクアセスメントでは、危険性または有害性ごとに、頻度や重大性からリスクを定量的に見積もる。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"リスクアセスメントでは危険性・有害性を特定し、発生可能性（頻度）と重篤度などからリスクを見積もって優先順位を決め、低減措置を検討する。","memory":"RA＝危険源特定→リスク見積り→優先順位→低減。","source":"https://www.mhlw.go.jp/bunya/roudoukijun/anzeneisei14/dl/press1-5.pdf"},{"id":"2025-23","year":2025,"number":23,"type":"真偽","question":"墜落制止用器具を使用する際は、一本つりではなく、U字つりのものを使用しなければならない。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"×","figure":false,"figureType":"","image":null,"explanation":"U字つり用胴ベルトは主にワークポジショニング用途であり、墜落制止用器具は「U字つりにしなければならない」というものではない。現行ルールではフルハーネス型が原則となる場面がある。","memory":"U字つり＝作業姿勢保持。墜落制止とは用途を分ける。","source":"https://www.mhlw.go.jp/web/t_doc?dataId=00tc8681&dataType=1&pageNo=1"},{"id":"2025-24","year":2025,"number":24,"type":"真偽","question":"B火災とは、石油やガソリンなどが燃える火災である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"B火災は石油・ガソリンなどの油類による火災。記述は正しい。","memory":"B火災＝油火災。","source":"https://www.fdma.go.jp/singi_kento/kento/items/post-53/01/sankou9.pdf"},{"id":"2025-25","year":2025,"number":25,"type":"真偽","question":"クレーン等安全規則によると、玉掛け作業において、ワイヤロープの直径の減少が公称径の7%を超えるものは使用不可である。","options":{"ア":"","イ":"","ウ":"","エ":""},"answer":"〇","figure":false,"figureType":"","image":null,"explanation":"玉掛け用ワイヤロープは、直径の減少が公称径の7%を超えるものを使用してはならない。記述は正しい。","memory":"玉掛けワイヤ：径の減少7%超は使用不可。","source":"https://www.mhlw.go.jp/www2/public/kaitou/09_besshi.htm"},{"id":"2025-26","year":2025,"number":26,"type":"4択","question":"直流電動機の速度制御と制動に関する記述のうち、適切なものはどれか。","options":{"ア":"界磁制御法において、界磁抵抗器の抵抗を小さくすると、回転速度は速くなる。","イ":"抵抗制御法には、ワード・レオナード方式やイルグナ方式などがある。","ウ":"回生制動は、圧縮空気などで制動機を動作させる機械的な制動方式である。","エ":"発電制動とは、運転中の電動機を他励発電機として使用する制動方式である。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。発電制動（ダイナミックブレーキ）は、運転中の直流電動機を発電機として動作させ、運動エネルギーを電気エネルギーに変えて抵抗などで消費して制動する。","memory":"発電制動＝モータを発電機として使い、運動エネルギーを消費。","source":"https://jeea.or.jp/course/contents/07109/"},{"id":"2025-27","year":2025,"number":27,"type":"4択","question":"電動機に関する記述のうち、適切でないものはどれか。","options":{"ア":"三相誘導電動機は、すべりが小さくなるほど回転速度が速くなる。","イ":"同期電動機は、交流電動機に分類される。","ウ":"サーボモータに用いられる制御方式は、オープンループ方式である。","エ":"同期電動機は、始動トルクがゼロである。"},"answer":"ウ","figure":false,"figureType":"","image":null,"explanation":"正解はウ。サーボモータは位置・速度などを検出してフィードバックするクローズドループ制御が基本で、オープンループ方式という記述が誤り。","memory":"サーボ＝フィードバックするクローズドループ。","source":"https://www.fa.omron.co.jp/guide/technicalguide/14/186/index.html"},{"id":"2025-28","year":2025,"number":28,"type":"4択","question":"電磁開閉器に関する記述のうち、適切なものはどれか。","options":{"ア":"電磁接触器からショックリレーを外したものである。","イ":"電磁接触器に熱動形過負荷リレーを加えたものである。","ウ":"電磁接触器にヒューズを加えたものである。","エ":"電磁接触器から遮断器を外したものである。"},"answer":"イ","figure":false,"figureType":"","image":null,"explanation":"正解はイ。電磁開閉器（マグネットスイッチ）は、電磁接触器に熱動形過負荷リレー（サーマルリレー）を組み合わせ、開閉と過負荷保護を行う。","memory":"電磁開閉器＝電磁接触器＋サーマルリレー。","source":"https://www.fa.omron.co.jp/guide/technicalguide/753/343/"},{"id":"2025-29","year":2025,"number":29,"type":"4択","question":"フィードフォワード制御に関する記述のうち、適切なものはどれか。","options":{"ア":"前回の制御量を目標値と比較し、それらを一致させるように操作量を生成する制御方式","イ":"あらかじめ定められた変化をする目標値に追従させる制御方式","ウ":"比例動作、積分動作、および微分動作の３つの動作を含む制御方式","エ":"目標値、外乱などの情報に基づいて、操作量を決定する制御方式"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。フィードフォワード制御は、目標値や外乱など事前に得られる情報から操作量を決め、出力誤差が現れてから修正するフィードバックより先回りして補償する。","memory":"FF＝外乱・目標値から先回り、FB＝誤差を見て後から修正。","source":"https://www.fa.omron.co.jp/guide/technicalguide/14/186/index.html"},{"id":"2025-30","year":2025,"number":30,"type":"4択","question":"ロータリエンコーダの出力方式に関する記述のうち、適切でないものはどれか。","options":{"ア":"インクリメンタル方式は、電源遮断時の位置を記憶できる。","イ":"アブソリュート方式は、電源遮断時の位置を記憶できる。","ウ":"インクリメンタル方式は、回転方向を検出できる。","エ":"アブソリュート方式は、回転方向を検出できる。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。インクリメンタル方式は基準位置からのパルス増減で位置を求めるため、通常は電源断で絶対位置情報を保持しない。アブソリュート方式は各位置に固有コードを持つ。","memory":"インクリ＝相対位置、アブソ＝絶対位置。","source":"https://www.fa.omron.co.jp/product/selection/34/func_spec.html"},{"id":"2025-31","year":2025,"number":31,"type":"4択","question":"電気および磁気に関する記述のうち、適切でないものはどれか。","options":{"ア":"コンデンサに交流電圧を印加した場合、電流は静電容量に正比例する。","イ":"ガラスとビニールをこすり合わせると両者は互いに引き合う。","ウ":"比透磁率とは、磁性体の温度変化による透磁率の変化の割合のことである。","エ":"2枚の電極間に電荷を蓄えると、静電気力が発生する。"},"answer":"ウ","figure":false,"figureType":"","image":null,"explanation":"正解はウ。比透磁率は物質の透磁率μを真空の透磁率μ₀で割った比（μ/μ₀）であり、「温度変化による透磁率の変化割合」ではない。","memory":"比透磁率 μr＝μ/μ₀。","source":"https://www.keyence.co.jp/ss/products/recorder/lab/glossary/"},{"id":"2025-32","year":2025,"number":32,"type":"4択","question":"電子に関する記述のうち、適切なものはどれか。","options":{"ア":"自由電子の数が多い物質を絶縁体という。","イ":"原子核は、電子全体と同じ量の負の電気量をもつ。","ウ":"電子1個は、約3×10⁸Cの正の電気量をもつ。","エ":"摩擦電気は、電子の移動により起きる現象である。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。摩擦帯電は物質間で電子が移動することで起きる。電子は負電荷、原子核は正電荷で、自由電子が多い物質は一般に導体。","memory":"摩擦電気＝電子の移動。","source":"https://atomica.jaea.go.jp/data/detail/dat_detail_03-06-03-01.html"},{"id":"2025-33","year":2025,"number":33,"type":"4択","question":"直流の電気回路に関する記述のうち、適切でないものはどれか。","options":{"ア":"1Wの電力を1時間使用すると、発生する熱量は、1Jである。","イ":"1Ωの抵抗に1Aの電流を流すために必要な電圧は、1Vである。","ウ":"1秒間に1Cの電荷が移動するときに流れる電流は、1Aである。","エ":"1Vの電圧で1Aの電流が流れたときの電力は、1Wである。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。1W＝1J/sなので、1Wを1時間（3600s）使うとエネルギーは3600J。ほかは V＝IR、I＝Q/t、P＝VI の基本関係に一致する。","memory":"1W×1h＝1Wh＝3600J。","source":"https://www.keyence.co.jp/ss/products/recorder/lab/glossary/"},{"id":"2025-34","year":2025,"number":34,"type":"4択","question":"下図の回路図において、電流Iの数値として、適切なものはどれか。","options":{"ア":"0.3A","イ":"0.5A","ウ":"0.7A","エ":"0.9A"},"answer":"イ","figure":true,"figureType":"図","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAQwAAADlCAMAAACRbjlfAAAAAXNSR0IArs4c6QAAAARnQU1BAACxjwv8YQUAAAL9UExURf///+vr6/v7+/7+/vn5+fr6+v39/fX19fj4+Pz8/Pb29vT09Pf397i4uJOTk5WVlZSUlJubm+Xl5fDw8LOzs5CQkJ2dndLS0uzs7Le3t4+Pj5eXl8fHx1paWjc3Nz8/Pz4+Pk9PT9jY2GBgYKenp4uLi1lZWd7e3nh4eFxcXJqamrCwsFFRUe3t7WxsbMTExNnZ2d3d3erq6jo6OqysrH9/fzw8PMnJyaampuTk5HJycjg4OOLi4qioqDQ0NN/f35ycnO/v72FhYWlpadvb21BQUKWlpb+/v+bm5klJScXFxSQkJMbGxisrK8zMzERERNzc3EJCQj09PTAwMF5eXtra2mNjY1NTU/Hx8c/Pzx4eHrm5ucPDwy4uLtTU1JmZmUZGRtfX19XV1Z6eni0tLXBwcFVVVfLy8tPT07q6utbW1jU1NXp6eikpKXNzc01NTSYmJsjIyH19fbGxsS8vL66urnZ2dtDQ0L6+vl1dXX5+fsLCwjExMW5ubpiYmImJiXx8fGZmZjs7O9HR0YCAgExMTM7OzsvLy0dHR0VFRXR0dHV1dc3NzY2NjWtra2pqau7u7nFxcZ+fn+Pj43l5ebS0tAsLCwwMDA4ODg0NDQMDA0NDQwUFBW9vb6Kioujo6AoKCr29va2trby8vIyMjI6Ojq+vrwcHBwQEBA8PDxcXF/Pz8zY2Njk5OW1tbRISErW1tXd3d6urq7u7u+np6eDg4GJiYl9fX5KSkmRkZGVlZZGRkQkJCVJSUgEBASAgICMjI4SEhEpKSsHBwaCgoFhYWFRUVDIyMiIiIqOjo2dnZx8fHygoKIWFhUtLS+fn51ZWVnt7e1tbW7a2tsDAwKmpqaGhoSoqKhMTExoaGhUVFRsbGxEREZaWlgICAoqKigAAABgYGLKyskhISIODg0FBQYeHhwgICKSkpBYWFsrKyh0dHTMzM4GBgRkZGSwsLCUlJaqqqmhoaOHh4RwcHBAQEEBAQAYGBiEhIVdXVycnJ4iIiIaGhoKCgk5OTvckJ2oAAAAJcEhZcwAAEnQAABJ0Ad5mH3gAAA/TSURBVHhe7Z0HWBTHAoCH27u9AooKETUgCiJYEGmCQiQoUTRGUcAGERs5ROwoKmCMNXaQ0GwYe8BCFCUabAkxauIjmKgpqKfBEmvyjJqXh+97u3ujWXWLwO7tlfk/uZudHc7bn2k7uzsDEAgEAoFAIBAGw8rigAfOhMzigAfOBCYMMrlCrsDJgFJFvhGoNdY2+pBxAQ9cPNQNGto2atwEYHb2rzV1oP6/Zs0btnjdUUnttiyUTi2dW7V2Abitaxu3tu5EjJ1Hu/YdXuvY1AJteHby6tzZWwV8fP1knq7+CiBr3yXABrMObOkFU1gQXbt5qonCgQUGBQPsje4hwN33TbKwhPboKX4ZNTbC3mrfq3c4L figure":false,"figureType":"","image":null,"explanation":"正解はイ。高調波はコンデンサやリアクトルの過熱・焼損、漏電遮断器など電子機器の誤動作を生じさせることがある。設問では電磁接触器の誤動作との組合せが不適切。","memory":"高調波＝コンデンサ/リアクトル過熱、電子保護機器の誤動作に注意。","source":"https://jeea.or.jp/course/contents/12144/"},{"id":"2025-41","year":2025,"number":41,"type":"4択","question":"ノイズの除去に関する記述のうち、適切でないものはどれか。","options":{"ア":"静電誘導ノイズ対策をする場合、シールド線を両端で確実に接地する。","イ":"信号線を撚り合わせて電磁誘導ノイズを打ち消す。","ウ":"ケーブルに銅テープを巻き、接地する。","エ":"動力線の接地場所と信号線の接地場所は、別に設ける。"},"answer":"ア","figure":false,"figureType":"","image":null,"explanation":"正解はア。静電誘導ノイズ対策のシールドは、低周波信号では一般に片端接地としてグランドループを避ける。ツイストペアは電磁誘導ノイズの相殺に有効。","memory":"静電ノイズ＝シールド、電磁ノイズ＝ツイスト。低周波シールドは片端接地が基本。","source":"https://www.keyence.co.jp/ss/products/measure-sys/measurement-selection/noise.jsp"},{"id":"2025-42","year":2025,"number":42,"type":"4択","question":"正常運転していた三相誘導電動機が異常発熱した。この場合の対応処置として、適切でないものはどれか。","options":{"ア":"電磁開閉器の導通を確認する。","イ":"接地状態を点検する。","ウ":"欠相していないかを点検する。","エ":"電源電圧を点検する。"},"answer":"イ","figure":false,"figureType":"","image":null,"explanation":"正解はイ。異常発熱なら欠相、電源電圧、電磁開閉器の接触不良・導通など、電流増加や不平衡につながる要因を優先確認する。接地状態は重要な安全項目だが、通常は発熱原因の直接確認項目ではない。","memory":"モータ発熱＝欠相・電圧異常・接触不良をまず確認。","source":"https://jeea.or.jp/course/contents/07115/"},{"id":"2025-43","year":2025,"number":43,"type":"4択","question":"クランプメータで負荷電流を測定する場合の測定方法として、適切なものはどれか。","options":{"ア":"三相線路の場合、3相分の電線を、クランプの中心に閉じて測定する。","イ":"単相線路の場合、2相分の電線を、クランプの中心に閉じて測定する。","ウ":"三相線路、単相線路のどちらの場合でも、2相分の電線を、クランプの中心に閉じて測定する。","エ":"三相線路、単相線路のどちらの場合でも、1相分の電線を、クランプの中心に閉じて測定する。"},"answer":"エ","figure":false,"figureType":"","image":null,"explanation":"正解はエ。負荷電流を測るときは1本（1相）の導体だけをクランプする。往復する複数導体をまとめて挟むと磁束が相殺され、負荷電流を正しく読めない。","memory":"負荷電流は1本だけクランプ。複数本まとめると相殺。","source":"https://www.hioki.co.jp/jp/learning/clamp/"},{"id":"2025-44","year":2025,"number":44,"type":"4択","question":"下図に示す固定抵抗器において、抵抗値の許容差を示す箇所として、適切なものはどれか。","options":{"ア":"A","イ":"B","ウ":"C","エ":"D"},"answer":"エ","figure":true,"figureType":"図","image":"data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAT0AA <script>
const QUESTIONS=JSON.parse(document.getElementById('question-data').textContent);
const STORE_KEY='denki2_quiz_2023_2025_v1';
const LABELS=['ア','イ','ウ','エ'];
let settings={year:'all',order:'normal'};
let session=[],pos=0,sessionCorrect=0,answers={},sessionWrong=new Set(),lastMode='all';
let stats=loadStats();

function loadStats(){try{return JSON.parse(localStorage.getItem(STORE_KEY))||{q:{},missed:[]}}catch(e){return{q:{},missed:[]}}}
function saveStats(){try{localStorage.setItem(STORE_KEY,JSON.stringify(stats))}catch(e){}}
function missedSet(){return new Set(stats.missed||[])}
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),1800)}
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function byYear(q){return settings.year==='all'||String(q.year)===settings.year}
function setScreen(name){['homeScreen','quizScreen','resultScreen'].forEach(id=>document.getElementById(id).classList.toggle('hidden',id!==name));window.scrollTo({top:0,behavior:'instant'})}
function updateHome(){const entries=Object.values(stats.q||{});const attempts=entries.reduce((s,x)=>s+(x.attempts||0),0);const correct=entries.reduce((s,x)=>s+(x.correct||0),0);document.getElementById('statDone').textContent=entries.length;document.getElementById('statRate').textContent=attempts?Math.round(correct/attempts*100)+'%':'—';document.getElementById('statMissed').textContent=(stats.missed||[]).length;document.getElementById('missedBtnCount').textContent=`(${(stats.missed||[]).length})`}
function startQuiz(mode='all',customIds=null){let pool=QUESTIONS.filter(byYear);if(customIds){const ids=new Set(customIds);pool=pool.filter(q=>ids.has(q.id))}else if(mode==='missed'){const miss=missedSet();pool=pool.filter(q=>miss.has(q.id))}if(!pool.length){toast(mode==='missed'?'この条件の苦手問題はありません':'対象の問題がありません');return}if(settings.order==='random')pool=shuffle(pool);session=pool;pos=0;sessionCorrect=0;answers={};sessionWrong=new Set();lastMode=mode;setScreen('quizScreen');renderQuestion()}
function formatOptionText(s){if(!s)return'';return s.replace(/\s*([ABCD]：)/g,(m,p,off)=>off?`\n${p}`:p).trim()}
function displayAnswer(q){if(q.type==='真偽')return q.answer==='〇'?'〇（正しい）':'×（誤り）';const txt=q.options[q.answer]||'';return txt&&txt!==q.answer?`${q.answer}：${txt}`:q.answer}
function renderQuestion(){window.scrollTo({top:0,left:0,behavior:'auto'});const q=session[pos];const answered=answers[q.id];document.getElementById('quizMeta').textContent=`${q.year}年度・問${q.number}　${pos+1}/${session.length}`;document.getElementById('scorePill').textContent=`${sessionCorrect} / ${Object.keys(answers).length}`;document.getElementById('progressBar').style.width=`${((pos+1)/session.length)*100}%`;document.getElementById('typeBadge').textContent=q.type==='真偽'?'〇× 真偽問題':'4択問題';document.getElementById('qid').textContent=q.id;document.getElementById('questionText').textContent=q.question;
 const fw=document.getElementById('figureWrap'),img=document.getElementById('questionImage');if(q.image){img.src=q.image;fw.classList.remove('hidden')}else{img.removeAttribute('src');fw.classList.add('hidden')}
 const op=document.getElementById('options');op.innerHTML='';op.className=q.type==='真偽'?'options tf-grid':'options';const choices=q.type==='真偽'?[['〇','正しい'],['×','誤り']]:LABELS.map(k=>[k,q.options[k]||'']);choices.forEach(([key,text])=>{const b=document.createElement('button');b.className='option';b.dataset.key=key;const showText=q.type==='4択'&&text===key?'':formatOptionText(text);b.innerHTML=`<span class="mark">${key}</span><span class="txt"></span>`;b.querySelector('.txt').textContent=showText;b.addEventListener('click',()=>answer(key));op.appendChild(b)});
 document.getElementById('feedback').classList.add('hidden');document.getElementById('explain').classList.add('hidden');document.getElementById('nextBtn').disabled=!answered;document.getElementById('prevBtn').disabled=pos===0;if(answered)showAnswered(q,answered,false)}
function answer(key){const q=session[pos];if(answers[q.id])return;const ok=key===q.answer;answers[q.id]={key,ok};if(ok)sessionCorrect++;else sessionWrong.add(q.id);const rec=stats.q[q.id]||{attempts:0,correct:0};rec.attempts++;if(ok)rec.correct++;stats.q[q.id]=rec;const miss=missedSet();if(ok)miss.delete(q.id);else miss.add(q.id);stats.missed=[...miss];saveStats();showAnswered(q,answers[q.id],true)}
function showAnswered(q,a,scroll){document.querySelectorAll('.option').forEach(b=>{b.disabled=true;const k=b.dataset.key;if(k===a.key)b.classList.add('selected',a.ok?'correct':'wrong');if(k===q.answer&&!a.ok)b.classList.add('correct-answer')});const fb=document.getElementById('feedback');fb.className='feedback '+(a.ok?'ok':'ng');document.getElementById('feedbackTitle').textContent=a.ok?'✓ 正解！':'✕ 不正解';document.getElementById('correctLine').textContent='正解：'+displayAnswer(q);fb.classList.remove('hidden');document.getElementById('explanationText').textContent=q.explanation;document.getElementById('memoryText').textContent=q.memory;const link=document.getElementById('sourceLink');if(q.source){link.href=q.source;link.classList.remove('hidden')}else link.classList.add('hidden');document.getElementById('explain').classList.remove('hidden');document.getElementById('nextBtn').disabled=false;document.getElementById('scorePill').textContent=`${sessionCorrect} / ${Object.keys(answers).length}`;if(scroll)setTimeout(()=>fb.scrollIntoView({behavior:'smooth',block:'nearest'}),80)}
function next(){if(pos<session.length-1){pos++;renderQuestion()}else finish()}
function prev(){if(pos>0){pos--;renderQuestion()}}
function finish(){setScreen('resultScreen');const total=session.length,wrong=sessionWrong.size,rate=total?Math.round(sessionCorrect/total*100):0;document.getElementById('resultScore').textContent=`${sessionCorrect} / ${total}`;document.getElementById('resultSub').textContent=`正答率 ${rate}% ・ 今回の間違い ${wrong}問`;document.getElementById('resultIcon').textContent=rate>=90?'🏆':rate>=70?'🎉':'📘';document.getElementById('retryWrongBtn').disabled=wrong===0;updateHome()}
function goHome(){setScreen('homeScreen');updateHome()}

document.getElementById('yearChips').addEventListener('click',e=>{const b=e.target.closest('[data-year]');if(!b)return;settings.year=b.dataset.year;document.querySelectorAll('#yearChips .chip').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('orderSeg').addEventListener('click',e=>{const b=e.target.closest('[data-order]');if(!b)return;settings.order=b.dataset.order;document.querySelectorAll('#orderSeg button').forEach(x=>x.classList.toggle('active',x===b))});
document.getElementById('startAll').onclick=()=>startQuiz('all');document.getElementById('startMissed').onclick=()=>startQuiz('missed');document.getElementById('homeBtn').onclick=goHome;document.getElementById('resultHomeBtn').onclick=goHome;document.getElementById('nextBtn').onclick=next;document.getElementById('prevBtn').onclick=prev;document.getElementById('retryBtn').onclick=()=>startQuiz(lastMode);document.getElementById('retryWrongBtn').onclick=()=>startQuiz('custom',[...sessionWrong]);
document.getElementById('resetStats').onclick=()=>{if(confirm('学習履歴・正答率・苦手問題をすべてリセットしますか？')){stats={q:{},missed:[]};saveStats();updateHome();toast('学習履歴をリセットしました')}};
document.getElementById('questionImage').onclick=()=>{const q=session[pos];if(!q?.image)return;document.getElementById('modalImage').src=q.image;document.getElementById('imageModal').classList.remove('hidden')};document.getElementById('closeModal').onclick=()=>document.getElementById('imageModal').classList.add('hidden');document.getElementById('imageModal').addEventListener('click',e=>{if(e.target.id==='imageModal')e.currentTarget.classList.add('hidden')});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&!document.getElementById('imageModal').classList.contains('hidden')){document.getElementById('imageModal').classList.add('hidden');return}if(document.getElementById('quizScreen').classList.contains('hidden'))return;const q=session[pos];if(!answers[q.id]){if(q.type==='真偽'&&(e.key==='o'||e.key==='O'))answer('〇');if(q.type==='真偽'&&(e.key==='x'||e.key==='X'))answer('×');if(q.type==='4択'){const map={'1':'ア','2':'イ','3':'ウ','4':'エ'};if(map[e.key])answer(map[e.key])}}else if(e.key==='Enter'||e.key==='ArrowRight')next()});
updateHome();
</script>
</body>
</html>
